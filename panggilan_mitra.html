<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resik.in - Memanggil...</title>
    <style>
        /* ========================================================
           1. VARIABEL GLOBAL (WAJIB SESUAI PANDUAN KONSISTENSI)
           ======================================================== */
        :root {
            --primary-color: #0056D6;
            --danger-color: #D92D20; /* Merah untuk akhiri panggilan */
            --bg-light: #F9FAFB;
            --text-dark: #1D2939;
            --text-gray: #667085;
            --white: #FFFFFF;
            --avatar-profil: url('avatar.svg'); /* Memanggil foto profil */
            
            /* Variabel Tambahan Internal */
            --bg-btn-soft: #F1F5F9;
            --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.04);
            --shadow-avatar: 0 16px 32px rgba(0, 86, 214, 0.15);
            --shadow-danger: 0 8px 24px rgba(217, 45, 32, 0.3);
        }

        /* ========================================================
           2. RESET & TYPOGRAPHY DASAR
           ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Layar penuh tanpa scroll */
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; transition: all 0.2s ease; }

        /* ========================================================
           3. HEADER (POJOK KANAN ATAS)
           ======================================================== */
        .header {
            position: absolute;
            top: 32px;
            right: 48px;
            z-index: 10;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        /* ========================================================
           4. KONTEN UTAMA (PROFIL & STATUS PANGGILAN)
           ======================================================== */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Lingkaran Avatar Berbingkai Biru & Putih */
        .avatar-ring {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            padding: 4px;
            background-color: transparent;
            box-shadow: var(--shadow-avatar);
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: var(--avatar-profil);
            background-size: cover;
            background-position: center;
            background-color: #E2E8F0; /* Fallback warna */
            border: 2px solid var(--white); /* Border putih tipis di dalam ring biru */
        }

        /* Teks Profil */
        .profile-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .call-status {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            animation: pulseText 1.5s infinite ease-in-out;
        }

        /* Efek Animasi Memudar (Pulse) untuk Status Panggilan */
        @keyframes pulseText {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }

        /* ========================================================
           5. PANEL KONTROL AKSI (BAWAH)
           ======================================================== */
        .control-panel {
            background-color: var(--white);
            border-radius: 32px;
            padding: 48px 64px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            margin-top: 60px;
            width: 100%;
            max-width: 460px;
        }

        /* Baris Atas: 3 Tombol Aksi */
        .top-controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--bg-btn-soft);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover .icon-circle {
            background-color: #E2E8F0;
            transform: translateY(-2px);
        }

        .icon-circle svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Baris Bawah: Tombol Akhiri Panggilan */
        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .end-call-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .end-icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: var(--danger-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-danger);
            transition: all 0.2s ease;
        }

        .end-call-btn:hover .end-icon-circle {
            background-color: #B91C1C; /* Warna hover merah lebih gelap */
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(217, 45, 32, 0.4);
        }

        .end-icon-circle svg {
            width: 28px;
            height: 28px;
            stroke-width: 2.5;
            /* Memutar ikon gagang telepon agar menghadap ke bawah (hang up) */
            transform: rotate(135deg); 
        }

        .end-call-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--danger-color);
        }

        /* Responsiveness */
        @media (max-width: 640px) {
            .header { top: 24px; right: 24px; }
            .avatar-ring { width: 140px; height: 140px; }
            .profile-name { font-size: 28px; }
            .control-panel { padding: 40px 24px; gap: 40px; max-width: 90%; }
            .top-controls { gap: 24px; }
            .icon-circle { width: 52px; height: 52px; }
        }
    </style>
</head>
<body>

    <!-- Header Pojok Kanan Atas -->
    <header class="header">
        <div class="brand-logo">Resik.in</div>
    </header>

    <main class="main-container">
        
        <!-- Area Profil Utama (Tengah) -->
        <section class="profile-section">
            <div class="avatar-ring">
                <div class="avatar-image"></div>
            </div>
            
            <!-- Nama sesuai permintaan revisi -->
            <h1 class="profile-name">Budi Wijaya</h1>
            
            <p class="call-status">Memanggil...</p>
        </section>

        <!-- Panel Kontrol Aksi Bawah -->
        <section class="control-panel">
            
            <!-- Tiga Kolom Tombol Aksi -->
            <div class="top-controls">
                
                <!-- Tombol Senyap -->
                <a href="#" class="control-btn" aria-label="Senyap">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                            <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </div>
                    <span class="control-label">Senyap</span>
                </a>
                
                <!-- Tombol Speaker -->
                <a href="#" class="control-btn" aria-label="Speaker">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </div>
                    <span class="control-label">Speaker</span>
                </a>
                
                <!-- Tombol Pesan -->
                <a href="#" class="control-btn" aria-label="Pesan">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </div>
                    <span class="control-label">Pesan</span>
                </a>

            </div>

            <!-- Tombol Akhiri Panggilan -->
            <div class="bottom-controls">
                <a href="#" class="end-call-btn" aria-label="Akhiri Panggilan">
                    <div class="end-icon-circle">
                        <!-- Ikon Gagang Telepon (Tertelungkup) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </div>
                    <span class="end-call-label">Akhiri Panggilan</span>
                </a>
            </div>

        </section>

    </main>

</body>
</html>
