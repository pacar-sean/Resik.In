<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra Resik.in - Pengaturan Layanan</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #0056D6;
            --accent-color: #007BFF;
            --text-dark: #1D2939;
            --text-gray: #667085;
            --bg-light: #F9FAFB;
            --white: #FFFFFF;
            --border-radius: 12px;
            --foto-mitra: url('foto-mitra.svg'); 
            --border-color: #EAECF0;
            --danger-color: #DC2626;
            --success-color: #10B981;
            --sidebar-width: 260px;
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.03);
            --badge-blue-bg: #E1E8F5;
            --badge-blue-text: #475467;
            --badge-gray-bg: #E2E8F0;
            --badge-gray-text: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; transition: all 0.2s ease; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; transition: all 0.2s ease; background: transparent; }

        .sidebar { width: var(--sidebar-width); background-color: var(--white); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 32px 20px 24px; position: fixed; height: 100vh; z-index: 20; overflow-y: auto; }
        .brand-logo { font-size: 24px; font-weight: 700; color: var(--primary-color); margin-bottom: 32px; padding-left: 12px; letter-spacing: -0.5px; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-left: 12px; }
        .avatar-wrapper { position: relative; width: 48px; height: 48px; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; background-image: var(--foto-mitra); background-size: cover; background-position: center; background-color: #D1E0FF; border: 2px solid var(--white); }
        .status-dot { position: absolute; bottom: 2px; right: 0px; width: 12px; height: 12px; background-color: var(--success-color); border-radius: 50%; border: 2px solid var(--white); }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 15px; font-weight: 600; color: var(--text-dark); }
        .profile-status { font-size: 12px; color: var(--text-gray); }
        .nav-menu { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--text-gray); font-weight: 500; font-size: 14px; transition: all 0.2s ease; }
        .nav-link svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-link:hover { background-color: var(--bg-light); color: var(--text-dark); }
        .nav-link.active { background-color: var(--primary-color); color: var(--white); font-weight: 600; }
        .btn-logout { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--danger-color); font-weight: 500; font-size: 15px; margin-top: auto; background: transparent; }
        .btn-logout svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-logout:hover { opacity: 0.7; }

        .main-wrapper { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex-grow: 1; padding: 40px 48px; display: flex; flex-direction: column; }
        .page-header { display: flex; flex-direction: column; align-items: flex-end; text-align: right; margin-bottom: 48px; }
        .page-title { font-size: 18px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
        .page-subtitle { font-size: 15px; color: var(--text-gray); }

        .service-section { margin-bottom: 48px; }
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .section-icon { color: var(--primary-color); display: flex; align-items: center; }
        .section-icon svg { width: 24px; height: 24px; stroke-width: 2; }
        .section-title { font-size: 18px; font-weight: 600; color: var(--text-dark); }

        .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

        .service-card { background-color: var(--white); border-radius: var(--border-radius); padding: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); display: flex; flex-direction: column; transition: box-shadow 0.2s; }
        .service-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.06); }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; }
        .badge-blue { background-color: var(--badge-blue-bg); color: var(--badge-blue-text); }
        .badge-gray { background-color: var(--badge-gray-bg); color: var(--badge-gray-text); }

        .card-title { font-size: 18px; font-weight: 600; color: var(--text-dark); margin-bottom: 12px; }
        .card-desc { font-size: 14px; color: var(--text-gray); line-height: 1.5; flex-grow: 1; margin-bottom: 24px; }
        .divider { height: 1px; background-color: var(--border-color); margin-bottom: 16px; border: none; }
        .card-footer { display: flex; flex-direction: column; gap: 4px; }
        .price-label { font-size: 12px; color: var(--text-gray); }
        .price-value { font-size: 18px; font-weight: 700; color: var(--primary-color); }

        /* Loading & Empty */
        .loading-text { color: var(--text-gray); font-size: 15px; padding: 24px 0; }
        .empty-text { color: var(--text-gray); font-size: 15px; padding: 24px 0; }

        @media (max-width: 1200px) { .service-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-wrapper { margin-left: 0; width: 100%; } .main-content { padding: 24px; } .service-grid { grid-template-columns: 1fr; } .page-header { align-items: flex-start; text-align: left; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-logo">Mitra Resik.in</div>
    <div class="sidebar-profile">
        <div class="avatar-wrapper">
            <div class="profile-avatar"></div>
            <div class="status-dot"></div>
        </div>
        <div class="profile-info">
            <span class="profile-name" id="sidebar-nama">-</span>
            <span class="profile-status">Status: Aktif</span>
        </div>
    </div>
    <nav class="nav-menu">
        <a href="dashboard_mitra.html" class="nav-link">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Dashboard
        </a>
        <a href="pesanan_masuk_mitra.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Pesanan
        </a>
        <a href="keuangan_mitra.html" class="nav-link">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            Keuangan
        </a>
        <a href="layanan_mitra.html" class="nav-link active">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            Layanan
        </a>
        <a href="profil_mitra.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Profil
        </a>
        <a href="chat_mitra.html" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Chat
        </a>
    </nav>
    <button class="btn-logout" id="btn-logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Keluar
    </button>
</aside>

<div class="main-wrapper">
    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Pengaturan Layanan</h1>
            <p class="page-subtitle">Atur paket layanan yang ingin Anda tawarkan kepada pelanggan.</p>
        </header>

        <!-- Konten layanan diisi JS -->
        <div id="layanan-container">
            <p class="loading-text">Memuat layanan...</p>
        </div>
    </main>
</div>

<script>
    const SUPABASE_URL = 'https://dljidtzrnavsvxppdkdb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsamlkdHpybmF2c3Z4cHBka2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTg5NjcsImV4cCI6MjA5NDczNDk2N30.QzqUNPeQt7tEc7hiz6l3JWV4EM2hQP0AoAfRyYQ1M30';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userData = JSON.parse(localStorage.getItem('resik_user') || '{}');
    if (!userData.id_user) {
        window.location.href = 'login_register.html';
    }

    document.getElementById('sidebar-nama').textContent = userData.nama || 'Mitra';

    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('resik_user');
        window.location.href = 'login_register.html';
    });

    function formatHarga(harga) {
        if (!harga) return 'Rp 0';
        return 'Rp ' + Number(harga).toLocaleString('id-ID');
    }

    function renderLayanan(data) {
        const container = document.getElementById('layanan-container');

        if (!data || data.length === 0) {
            container.innerHTML = `<p class="empty-text">Tidak ada data layanan tersedia.</p>`;
            return;
        }

        // Kelompokkan berdasarkan kategori
        const grouped = {};
        data.forEach(item => {
            const kat = item.kategori || 'Lainnya';
            if (!grouped[kat]) grouped[kat] = [];
            grouped[kat].push(item);
        });

        const ikonKategori = {
            'Kebersihan': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`,
            'default': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>`
        };

        let html = '';
        Object.entries(grouped).forEach(([kategori, items]) => {
            const ikon = ikonKategori[kategori] || ikonKategori['default'];
            const kartu = items.map(item => `
                <div class="service-card">
                    <div class="card-top">
                        <span class="badge badge-blue">${item.kategori || '-'}</span>
                    </div>
                    <h3 class="card-title">${item.nama_layanan || '-'}</h3>
                    <p class="card-desc">${item.deskripsi || 'Tidak ada deskripsi.'}</p>
                    <hr class="divider">
                    <div class="card-footer">
                        <span class="price-label">Mulai dari</span>
                        <span class="price-value">${formatHarga(item.harga)}</span>
                    </div>
                </div>
            `).join('');

            html += `
                <section class="service-section">
                    <div class="section-header">
                        <div class="section-icon">${ikon}</div>
                        <h2 class="section-title">${kategori}</h2>
                    </div>
                    <div class="service-grid">${kartu}</div>
                </section>
            `;
        });

        container.innerHTML = html;
    }

    async function loadLayanan() {
        const { data, error } = await supabaseClient
            .from('layanan')
            .select('*')
            .order('id_layanan', { ascending: true });

        if (error) {
            document.getElementById('layanan-container').innerHTML =
                `<p class="empty-text">Gagal memuat layanan. Coba refresh halaman.</p>`;
            return;
        }

        renderLayanan(data);
    }

    loadLayanan();
</script>
</body>
</html>
