<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra Resik.in - Daftar Pesanan Masuk</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* === SEMUA CSS SAMA PERSIS, TIDAK DIUBAH === */
        :root {
            --primary-color: #0056D6;
            --accent-color: #007BFF;
            --neutral-black: #333333;
            --neutral-gray-dark: #666666;
            --neutral-gray-light: #EAECF0;
            --white: #FFFFFF;
            --logo-brand: url('logo.svg');
            --foto-mitra: url('foto-mitra.svg'); 
            --bg-page: #F8FAFC;
            --bg-sidebar: #F4F7FB;
            --text-muted: #9CA3AF;
            --danger-color: #DC2626;
            --success-color: #10B981;
            --warning-bg: #FEF3C7;
            --warning-text: #B45309;
            --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            --border-radius-card: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        body { background-color: var(--bg-page); color: var(--neutral-black); -webkit-font-smoothing: antialiased; display: flex; min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; transition: all 0.2s; }
        button { cursor: pointer; border: none; outline: none; background: transparent; font-family: inherit; transition: all 0.2s ease; }
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--neutral-gray-light); display: flex; flex-direction: column; padding: 32px 20px 24px; flex-shrink: 0; position: fixed; height: 100vh; overflow-y: auto; z-index: 20; }
        .brand-title { font-size: 26px; font-weight: 800; color: var(--primary-color); margin-bottom: 36px; padding-left: 12px; letter-spacing: -0.5px; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-left: 12px; }
        .avatar-wrapper { position: relative; width: 48px; height: 48px; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; background-image: var(--foto-mitra); background-size: cover; background-position: center; background-color: #D1E0FF; border: 2px solid var(--white); }
        .status-dot { position: absolute; bottom: 2px; right: 0px; width: 12px; height: 12px; background-color: var(--success-color); border-radius: 50%; border: 2px solid var(--bg-sidebar); }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 15px; font-weight: 600; color: var(--neutral-black); }
        .profile-status { font-size: 12px; color: var(--neutral-gray-dark); }
        .nav-menu { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--neutral-gray-dark); font-weight: 500; font-size: 14px; }
        .nav-link svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-link:hover { background-color: var(--neutral-gray-light); color: var(--neutral-black); }
        .nav-link.active { background-color: var(--primary-color); color: var(--white); font-weight: 600; }
        .btn-logout { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--danger-color); font-weight: 600; font-size: 14px; margin-top: auto; border-radius: 8px; }
        .btn-logout svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-logout:hover { background-color: #FEE2E2; }
        .main-content { flex-grow: 1; margin-left: 260px; padding: 48px 40px; max-width: 1200px; display: flex; flex-direction: column; }
        .page-header { margin-bottom: 32px; }
        .page-title { font-size: 32px; font-weight: 800; color: var(--neutral-black); margin-bottom: 8px; }
        .page-subtitle { font-size: 15px; color: var(--neutral-gray-dark); }
        .tabs-container { display: flex; border-bottom: 1px solid var(--neutral-gray-light); margin-bottom: 32px; gap: 32px; }
        .tab-item { padding: 12px 0; font-size: 15px; font-weight: 600; color: var(--neutral-gray-dark); position: relative; margin-bottom: -1px; }
        .tab-item:hover { color: var(--neutral-black); }
        .tab-item.active { color: var(--primary-color); }
        .tab-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background-color: var(--primary-color); border-radius: 3px 3px 0 0; }
        .orders-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        .order-card { background-color: var(--white); border-radius: var(--border-radius-card); border: 1px solid var(--neutral-gray-light); padding: 24px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; position: relative; overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .order-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
        .card-blob { position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; background: #F0F5FF; border-radius: 50%; z-index: 0; opacity: 0.8; }
        .card-top, .card-middle, .card-actions { position: relative; z-index: 1; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .top-left-group { display: flex; align-items: center; gap: 16px; }
        .property-icon { width: 52px; height: 52px; background-color: #E8F2FF; color: var(--primary-color); border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .property-icon svg { width: 24px; height: 24px; stroke-width: 2; }
        .title-group { display: flex; flex-direction: column; gap: 6px; }
        .badge-category { background-color: var(--neutral-gray-light); color: var(--neutral-gray-dark); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; width: fit-content; letter-spacing: 0.5px; }
        .service-title { font-size: 20px; font-weight: 800; color: var(--neutral-black); letter-spacing: -0.3px; }
        .badge-time { background-color: var(--warning-bg); color: var(--warning-text); font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 20px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .badge-time svg { width: 14px; height: 14px; stroke-width: 2.5; }
        .card-middle { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 32px; }
        .info-col { display: flex; gap: 12px; align-items: flex-start; }
        .info-icon { color: var(--text-muted); margin-top: 2px; flex-shrink: 0; }
        .info-icon svg { width: 18px; height: 18px; stroke-width: 2; }
        .info-text-group { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .info-value { font-size: 14px; color: var(--neutral-black); line-height: 1.5; font-weight: 500; }
        .price-value { font-size: 20px; font-weight: 800; color: var(--primary-color); }
        .card-actions { display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid var(--neutral-gray-light); padding-top: 24px; margin-top: auto; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 700; text-align: center; }
        .btn-outline { background-color: var(--white); color: var(--primary-color); border: 1px solid var(--primary-color); }
        .btn-outline:hover { background-color: #F0F5FF; }
        .btn-solid { background-color: var(--primary-color); color: var(--white); }
        .btn-solid:hover { background-color: var(--accent-color); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* State kosong & loading */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--neutral-gray-dark); }
        .empty-state p { font-size: 16px; font-weight: 500; }
        .loading-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--neutral-gray-dark); font-size: 15px; }

        @media (max-width: 1024px) { .orders-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 24px; } .card-top { flex-direction: column; gap: 16px; align-items: flex-start; } .badge-time { align-self: flex-start; } .card-middle { grid-template-columns: 1fr; gap: 16px; } .card-actions { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>

<div class="app-container">

    <!-- SIDEBAR KIRI -->
    <aside class="sidebar">
        <h1 class="brand-title">Mitra Resik.in</h1>
        
        <div class="sidebar-profile">
            <div class="avatar-wrapper">
                <div class="profile-avatar"></div>
                <div class="status-dot"></div>
            </div>
            <div class="profile-info">
                <span class="profile-name" id="sidebar-nama">-</span>
                <span class="profile-status">Status: Aktif</span>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </a>
            <a href="pesanan_mitra.html" class="nav-link active">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Pesanan
            </a>
            <a href="keuangan_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                Keuangan
            </a>
            <a href="layanan_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Layanan
            </a>
            <a href="profil_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profil
            </a>
            <a href="chat_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Chat
            </a>
        </nav>

        <button class="btn-logout" id="btn-logout">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Keluar
        </button>
    </aside>

    <!-- KONTEN UTAMA KANAN -->
    <main class="main-content">
        
        <header class="page-header">
            <h1 class="page-title">Daftar Pesanan</h1>
            <p class="page-subtitle">Kelola jadwal pembersihan dan pantau pendapatan Anda hari ini.</p>
        </header>

        <!-- Tab Navigasi -->
        <div class="tabs-container">
            <a href="pesanan_mitra.html" class="tab-item active">Pesanan Masuk</a>
            <a href="pesanan_berjalan_mitra.html" class="tab-item">Sedang Berjalan</a>
            <a href="riwayat_pesanan_mitra.html" class="tab-item">Riwayat Selesai</a>
        </div>

        <!-- Grid Kartu Pesanan — diisi oleh JS -->
        <div class="orders-grid" id="orders-grid">
            <div class="loading-state">Memuat pesanan...</div>
        </div>
    </main>
</div>

<script>
    // ============================================================
    // INISIALISASI SUPABASE
    // ============================================================
    const SUPABASE_URL = 'https://dljidtzrnavsvxppdkdb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsamlkdHpybmF2c3Z4cHBka2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTg5NjcsImV4cCI6MjA5NDczNDk2N30.QzqUNPeQt7tEc7hiz6l3JWV4EM2hQP0AoAfRyYQ1M30';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ============================================================
    // AMBIL DATA USER DARI LOCALSTORAGE
    // ============================================================
    const userData = JSON.parse(localStorage.getItem('resik_user') || '{}');
    const idJasa = userData.id_jasa;
    const namaMitra = userData.nama || 'Mitra';

    // Tampilkan nama di sidebar
    document.getElementById('sidebar-nama').textContent = namaMitra;

    // Guard: kalau tidak ada id_jasa, redirect ke login
    if (!idJasa) {
        alert('Sesi tidak valid. Silakan login kembali.');
        window.location.href = 'login_register.html';
    }

    // ============================================================
    // LOGOUT
    // ============================================================
    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('resik_user');
        window.location.href = 'login_register.html';
    });

    // ============================================================
    // FORMAT TANGGAL & HARGA
    // ============================================================
    function formatTanggal(tgl) {
        if (!tgl) return '-';
        const d = new Date(tgl);
        const today = new Date();
        const tomorrow = new Date();
        tomorrow.setDate(today.getDate() + 1);

        const isToday = d.toDateString() === today.toDateString();
        const isTomorrow = d.toDateString() === tomorrow.toDateString();

        const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        if (isToday) return `Hari Ini, ${jam}`;
        if (isTomorrow) return `Besok, ${jam}`;
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + `, ${jam}`;
    }

    function formatHarga(harga) {
        if (!harga) return 'Rp 0';
        return 'Rp ' + Number(harga).toLocaleString('id-ID');
    }

    // ============================================================
    // ICON BERDASARKAN TIPE PROPERTI
    // ============================================================
    function getIcon(tipe) {
        const t = (tipe || '').toLowerCase();
        if (t.includes('apartemen') || t.includes('apartment')) {
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>`;
        }
        // Default: ikon rumah
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>`;
    }

    // ============================================================
    // RENDER KARTU PESANAN
    // ============================================================
    function renderKartu(pesanan) {
        const { id_pesanan, id_user, id_layanan, tgl_pesan, harga, jenis_pesanan, tipe } = pesanan;
        return `
        <div class="order-card" id="card-${id_pesanan}">
            <div class="card-blob"></div>

            <div class="card-top">
                <div class="top-left-group">
                    <div class="property-icon">
                        ${getIcon(tipe)}
                    </div>
                    <div class="title-group">
                        <span class="badge-category">${tipe || '-'}</span>
                        <h3 class="service-title">${jenis_pesanan || '-'}</h3>
                    </div>
                </div>
                <div class="badge-time">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    ${formatTanggal(tgl_pesan)}
                </div>
            </div>

            <div class="card-middle">
                <div class="info-col">
                    <div class="info-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    </div>
                    <div class="info-text-group">
                        <span class="info-label">ID Pesanan</span>
                        <span class="info-value">#${id_pesanan}</span>
                    </div>
                </div>
                <div class="info-col">
                    <div class="info-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                    </div>
                    <div class="info-text-group">
                        <span class="info-label">Estimasi Pendapatan</span>
                        <span class="price-value">${formatHarga(harga)}</span>
                    </div>
                </div>
            </div>

            <div class="card-actions">
    <a href="chat_mitra.html?id_penerima=${pesanan.id_user}&id_jasa=${pesanan.id_layanan}" class="btn btn-outline">Chat</a>
    <button class="btn btn-outline" onclick="updateStatus(${id_pesanan}, 'ditolak', this)">Tolak</button>
    <button class="btn btn-solid" onclick="updateStatus(${id_pesanan}, 'diterima', this)">Terima Pesanan</button>
</div>
        </div>`;
    }

    // ============================================================
    // FETCH PESANAN MASUK (status = 'menunggu')
    // ============================================================
    async function loadPesanan() {
        const grid = document.getElementById('orders-grid');

        try {
            const { data, error } = await supabaseClient
                .from('pesanan')
                .select('*')
                .eq('id_layanan', idJasa)
                .eq('status', 'menunggu')
                .order('tgl_pesan', { ascending: true });

            if (error) throw error;

            if (!data || data.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>Tidak ada pesanan masuk saat ini.</p></div>`;
                return;
            }

            grid.innerHTML = data.map(renderKartu).join('');

        } catch (err) {
            console.error('Error fetch pesanan:', err);
            grid.innerHTML = `<div class="empty-state"><p>Gagal memuat pesanan. Coba refresh halaman.</p></div>`;
        }
    }

    // ============================================================
    // UPDATE STATUS PESANAN (Terima / Tolak)
    // ============================================================
    async function updateStatus(idPesanan, statusBaru, btnEl) {
        // Disable kedua tombol di kartu ini agar tidak dobel-klik
        const card = document.getElementById(`card-${idPesanan}`);
        const buttons = card.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);

        try {
            const { error } = await supabaseClient
                .from('pesanan')
                .update({ status: statusBaru })
                .eq('id_pesanan', idPesanan);

            if (error) throw error;

            // Hapus kartu dari grid setelah berhasil
            card.style.transition = 'opacity 0.3s ease';
            card.style.opacity = '0';
            setTimeout(() => {
                card.remove();
                // Cek apakah grid sudah kosong
                const grid = document.getElementById('orders-grid');
                if (grid.children.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><p>Tidak ada pesanan masuk saat ini.</p></div>`;
                }
            }, 300);

        } catch (err) {
            console.error('Error update status:', err);
            alert('Gagal memperbarui status pesanan. Coba lagi.');
            // Re-enable tombol kalau gagal
            buttons.forEach(b => b.disabled = false);
        }
    }

    // ============================================================
    // JALANKAN
    // ============================================================
    loadPesanan();
</script>
</body>
</html>
