<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pelanggan - Resik.In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#1e1e1e] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl overflow-hidden shadow-2xl max-w-4xl w-full flex flex-col md:flex-row min-h-[550px]">
        
        <div class="md:w-1/2 bg-gradient-to-t from-[#0e3a5a] to-[#1e5d88] relative p-8 flex flex-col justify-end text-white min-h-[250px] md:min-h-auto">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <div class="relative z-10">
                <h1 class="text-2xl font-bold mb-2">Selamat Datang!</h1>
                <p class="text-xs md:text-sm text-gray-200 leading-relaxed font-light">
                    Bergabunglah dengan layanan kebersihan kos terbaik untuk menjaga kenyamanan dan kebersihan ruang tinggalmu setiap saat.
                </p>
            </div>
        </div>

        <div class="md:w-1/2 p-8 md:p-10 bg-[#f8fafc] flex flex-col justify-center">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-[#0f172a]">Buat Akun Baru</h2>
                <p class="text-xs text-gray-500 mt-1">Lengkapi data di bawah untuk mulai memesan layanan.</p>
            </div>

            <form class="space-y-4" onsubmit="event.preventDefault();">
                <div>
                    <label class="block text-xs font-semibold text-[#334155] mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">👤</span>
                        <input type="text" placeholder="Masukkan nama lengkap" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#0066cc] bg-white text-gray-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#334155] mb-1">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">✉️</span>
                        <input type="email" placeholder="contoh@email.com" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#0066cc] bg-white text-gray-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#334155] mb-1">Nomor HP</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">📞</span>
                        <input type="text" placeholder="08xxxxxxxxxx" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#0066cc] bg-white text-gray-800">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#334155] mb-1">Jenis Kelamin</label>
                        <label class="flex items-center space-x-2 p-2 border border-gray-200 rounded-lg bg-white cursor-pointer hover:bg-gray-50 text-xs text-gray-700">
                            <input type="radio" name="gender" value="L" class="text-[#0066cc] focus:ring-0">
                            <span>Laki-laki</span>
                        </label>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#334155] mb-1">&nbsp;</label>
                        <label class="flex items-center space-x-2 p-2 border border-gray-200 rounded-lg bg-white cursor-pointer hover:bg-gray-50 text-xs text-gray-700">
                            <input type="radio" name="gender" value="P" class="text-[#0066cc] focus:ring-0">
                            <span>Perempuan</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#334155] mb-1">Bergabung Sebagai</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center space-x-2 p-2 border border-gray-200 rounded-lg bg-white cursor-pointer hover:bg-gray-50 text-xs text-gray-700">
                            <input type="radio" name="role" value="mitra" class="text-[#0066cc] focus:ring-0">
                            <span>Mitra</span>
                        </label>
                        <label class="flex items-center space-x-2 p-2 border border-[#0066cc] bg-[#e6f0fa] rounded-lg cursor-pointer text-xs text-[#0066cc] font-medium">
                            <input type="radio" name="role" value="pelanggan" checked class="text-[#0066cc] focus:ring-0">
                            <span>Pelanggan</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#334155] mb-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm">🔒</span>
                        <input type="password" placeholder="Minimal 8 karakter" class="w-full pl-9 pr-10 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#0066cc] bg-white text-gray-800">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 cursor-pointer text-xs">👁️</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-[#0066cc] hover:bg-[#0052a3] text-white font-medium py-2.5 rounded-lg text-sm transition-colors mt-2 shadow-sm">
                    Daftar Sekarang
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-xs text-gray-500">
                    Sudah punya akun? <a href="#" class="text-[#0066cc] hover:underline font-medium">Masuk di sini</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
