<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitra Resik.in - Edit Profil</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #0056D6;
            --accent-color: #007BFF;
            --neutral-black: #333333;
            --neutral-gray-dark: #666666;
            --neutral-gray-light: #EAECF0;
            --white: #FFFFFF;
            --foto-mitra: url('foto-mitra.svg');
            --bg-body: #F8FAFC;
            --bg-sidebar: #F4F7FB;
            --danger-color: #DC2626;
            --success-color: #10B981;
            --border-radius-card: 16px;
            --border-radius-input: 8px;
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        body { background-color: var(--bg-body); color: var(--neutral-black); display: flex; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button { cursor: pointer; border: none; outline: none; background: transparent; font-family: inherit; transition: all 0.2s ease; }
        input { font-family: inherit; outline: none; }

        .app-container { display: flex; width: 100%; }

        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--neutral-gray-light); display: flex; flex-direction: column; padding: 32px 20px 24px 20px; flex-shrink: 0; position: fixed; height: 100vh; overflow-y: auto; }
        .brand-title { font-size: 22px; font-weight: 800; color: var(--primary-color); margin-bottom: 32px; padding-left: 12px; letter-spacing: -0.5px; }
        .sidebar-profile { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-left: 12px; }
        .sidebar-avatar-wrapper { position: relative; width: 48px; height: 48px; }
        .sidebar-avatar { width: 100%; height: 100%; border-radius: 50%; background-color: #D1E0FF; background-image: var(--foto-mitra); background-size: cover; background-position: center; }
        .status-dot { position: absolute; bottom: 2px; right: 0; width: 12px; height: 12px; background-color: var(--success-color); border-radius: 50%; border: 2px solid var(--bg-sidebar); }
        .sidebar-user-info { display: flex; flex-direction: column; }
        .sidebar-user-name { font-size: 15px; font-weight: 600; color: var(--neutral-black); }
        .sidebar-user-status { font-size: 12px; color: var(--neutral-gray-dark); }
        .nav-menu { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-input); color: var(--neutral-gray-dark); font-weight: 500; font-size: 14px; }
        .nav-link:hover { background-color: var(--neutral-gray-light); color: var(--neutral-black); }
        .nav-link.active { background-color: var(--primary-color); color: var(--white); font-weight: 600; }
        .nav-link svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btn-logout { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--danger-color); font-weight: 600; font-size: 14px; margin-top: auto; border-radius: var(--border-radius-input); }
        .btn-logout:hover { background-color: #FEE2E2; }

        .main-content { flex-grow: 1; margin-left: 260px; padding: 40px 60px 80px 60px; max-width: 1000px; }
        .page-header { margin-bottom: 32px; }
        .page-title { font-size: 32px; font-weight: 800; color: var(--neutral-black); margin-bottom: 8px; }
        .page-subtitle { font-size: 15px; color: var(--neutral-gray-dark); }

        .card { background-color: var(--white); border-radius: var(--border-radius-card); border: 1px solid var(--neutral-gray-light); padding: 32px 40px; box-shadow: var(--shadow-card); margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .card-title-group { display: flex; align-items: center; gap: 12px; }
        .card-title-icon { color: var(--primary-color); display: flex; align-items: center; }
        .card-title { font-size: 20px; font-weight: 700; color: var(--neutral-black); }

        .profile-edit-section { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
        .profile-edit-avatar { width: 80px; height: 80px; border-radius: 50%; background-color: #E2E8F0; background-image: var(--foto-mitra); background-size: cover; background-position: center; border: 2px solid var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .profile-edit-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
        .btn-upload { background-color: var(--neutral-gray-light); color: var(--neutral-black); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-upload:hover { background-color: #D1D5DB; }
        .upload-hint { font-size: 12px; color: var(--neutral-gray-dark); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: span 2; }
        .form-label { font-size: 14px; font-weight: 600; color: var(--neutral-black); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; color: var(--neutral-gray-dark); display: flex; align-items: center; pointer-events: none; }
        .input-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
        .form-control { width: 100%; padding: 12px 16px 12px 44px; border: 1px solid #D1D5DB; border-radius: var(--border-radius-input); font-size: 14px; color: var(--neutral-black); background-color: var(--white); transition: all 0.2s ease; }
        .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(0, 86, 214, 0.1); }
        .form-control:disabled { background-color: #F3F4F6; color: var(--neutral-gray-dark); cursor: not-allowed; border-color: var(--neutral-gray-light); }
        .input-hint { font-size: 11px; color: var(--neutral-gray-dark); margin-top: 4px; }

        .radio-group { display: flex; gap: 24px; align-items: center; height: 42px; }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-option input[type="radio"] { display: none; }
        .custom-radio { width: 18px; height: 18px; border: 2px solid #D1D5DB; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: all 0.2s ease; }
        .radio-option input[type="radio"]:checked + .custom-radio { border-color: var(--primary-color); }
        .radio-option input[type="radio"]:checked + .custom-radio::after { content: ''; width: 10px; height: 10px; background-color: var(--primary-color); border-radius: 50%; }
        .radio-label { font-size: 14px; color: var(--neutral-black); }

        .btn-add-address { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--primary-color); border-radius: var(--border-radius-input); color: var(--primary-color); font-size: 13px; font-weight: 600; }
        .btn-add-address:hover { background-color: #F0F5FF; }
        .address-list { display: flex; flex-direction: column; gap: 16px; }
        .address-card { border: 1px solid var(--neutral-gray-light); border-radius: var(--border-radius-input); padding: 20px 24px; background-color: var(--white); position: relative; }
        .address-card.main-address { border-left: 4px solid var(--primary-color); background-color: #F8FAFC; }
        .address-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .address-title-wrapper { display: flex; align-items: center; gap: 12px; }
        .address-title { font-size: 15px; font-weight: 700; color: var(--neutral-black); }
        .badge-utama { background-color: var(--primary-color); color: var(--white); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; letter-spacing: 0.5px; }
        .address-text { font-size: 14px; color: var(--neutral-gray-dark); line-height: 1.6; padding-right: 40px; }
        .address-actions { display: flex; gap: 12px; }
        .btn-icon { color: var(--neutral-gray-dark); display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { color: var(--neutral-black); transform: scale(1.1); }
        .btn-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        .bottom-actions { display: flex; justify-content: flex-end; align-items: center; gap: 20px; margin-top: 40px; }
        .btn-cancel { color: var(--neutral-gray-dark); font-size: 14px; font-weight: 600; padding: 12px 20px; }
        .btn-cancel:hover { color: var(--neutral-black); text-decoration: underline; }
        .btn-save { background-color: var(--primary-color); color: var(--white); padding: 14px 24px; border-radius: var(--border-radius-input); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-save:hover { background-color: var(--accent-color); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

        .alert-success { background-color: #D1FAE5; color: #065F46; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 20px; display: none; }

        @media (max-width: 1024px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } }
        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 24px; } .card { padding: 24px; } .bottom-actions { flex-direction: column-reverse; width: 100%; gap: 12px; } .btn-save { width: 100%; justify-content: center; } }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <h1 class="brand-title">Mitra Resik.in</h1>
        <div class="sidebar-profile">
            <div class="sidebar-avatar-wrapper">
                <div class="sidebar-avatar"></div>
                <div class="status-dot"></div>
            </div>
            <div class="sidebar-user-info">
                <span class="sidebar-user-name" id="sidebar-nama">-</span>
                <span class="sidebar-user-status">Status: Aktif</span>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="dashboard_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
                Dashboard
            </a>
            <a href="pesanan_masuk_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Pesanan
            </a>
            <a href="keuangan_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                Keuangan
            </a>
            <a href="layanan_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                Layanan
            </a>
            <a href="profil_mitra.html" class="nav-link active">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Profil
            </a>
            <a href="chat_mitra.html" class="nav-link">
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Chat
            </a>
        </nav>
        <button class="btn-logout" id="btn-logout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Keluar
        </button>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Edit Profil</h1>
            <p class="page-subtitle">Kelola informasi pribadi Anda.</p>
        </header>

        <div class="alert-success" id="alert-success">✓ Profil berhasil diperbarui!</div>

        <!-- KARTU INFORMASI DASAR -->
        <section class="card">
            <div class="card-header">
                <div class="card-title-group">
                    <div class="card-title-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <h2 class="card-title">Informasi Dasar</h2>
                </div>
            </div>

            <div class="profile-edit-section">
                <div class="profile-edit-avatar"></div>
                <div class="profile-edit-actions">
                    <button class="btn-upload" id="btn-unggah">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        Unggah Foto Baru
                    </button>
                    <input type="file" id="input-foto" hidden accept="image/png, image/jpeg">
                    <span class="upload-hint">Format: JPG, PNG. Maksimal 2MB.</span>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <input type="text" class="form-control" id="input-nama" placeholder="Nama lengkap">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Nomor WhatsApp</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </div>
                        <input type="tel" class="form-control" id="input-hp" placeholder="08xxxxxxxxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Alamat</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        </div>
                        <input type="text" class="form-control" id="input-alamat" placeholder="Alamat lengkap">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Jenis Kelamin</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="gender" value="laki-laki" id="radio-laki">
                            <div class="custom-radio"></div>
                            <span class="radio-label">Laki-laki</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="perempuan" id="radio-perempuan">
                            <div class="custom-radio"></div>
                            <span class="radio-label">Perempuan</span>
                        </label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label class="form-label">Email Aktif</label>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                        </div>
                        <input type="email" class="form-control" id="input-email" disabled>
                    </div>
                    <span class="input-hint">Email digunakan untuk login dan tidak dapat diubah.</span>
                </div>
            </div>
        </section>

        <!-- TOMBOL AKSI -->
        <div class="bottom-actions">
            <button class="btn-cancel" id="btn-cancel">Batal</button>
            <button class="btn-save" id="btn-save">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Simpan Perubahan
            </button>
        </div>
    </main>
</div>

<script>
    const SUPABASE_URL = 'https://dljidtzrnavsvxppdkdb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsamlkdHpybmF2c3Z4cHBka2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTg5NjcsImV4cCI6MjA5NDczNDk2N30.QzqUNPeQt7tEc7hiz6l3JWV4EM2hQP0AoAfRyYQ1M30';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userData = JSON.parse(localStorage.getItem('resik_user') || '{}');
    if (!userData.id_user) {
        window.location.href = 'login_register.html';
    }

    document.getElementById('sidebar-nama').textContent = userData.nama || '-';

    document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem('resik_user');
        window.location.href = 'login_register.html';
    });

    document.getElementById('btn-unggah').addEventListener('click', () => {
        document.getElementById('input-foto').click();
    });

    document.getElementById('input-foto').addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            alert('File dipilih: ' + e.target.files[0].name + '\n(Upload foto belum diimplementasi)');
        }
    });

    // Load data profil dari Supabase
    async function loadProfil() {
        const { data, error } = await supabaseClient
            .from('User')
            .select('nama, email, no_hp, alamat, jenis_kelamin')
            .eq('id_user', userData.id_user)
            .single();

        if (error || !data) {
            console.error('Gagal load profil:', error);
            return;
        }

        document.getElementById('input-nama').value = data.nama || '';
        document.getElementById('input-email').value = data.email || '';
        document.getElementById('input-hp').value = data.no_hp || '';
        document.getElementById('input-alamat').value = data.alamat || '';

        // Set radio jenis kelamin
        const gender = (data.jenis_kelamin || '').toLowerCase();
        if (gender === 'laki-laki') document.getElementById('radio-laki').checked = true;
        else if (gender === 'perempuan') document.getElementById('radio-perempuan').checked = true;
    }

    // Simpan perubahan ke Supabase
    document.getElementById('btn-save').addEventListener('click', async () => {
        const nama = document.getElementById('input-nama').value.trim();
        const noHp = document.getElementById('input-hp').value.trim();
        const alamat = document.getElementById('input-alamat').value.trim();
        const gender = document.querySelector('input[name="gender"]:checked')?.value || '';

        if (!nama) { alert('Nama tidak boleh kosong!'); return; }

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Menyimpan...';

        const { error } = await supabaseClient
            .from('User')
            .update({ nama, no_hp: noHp, alamat, jenis_kelamin: gender })
            .eq('id_user', userData.id_user);

        if (error) {
            alert('Gagal menyimpan: ' + error.message);
        } else {
            // Update localStorage
            userData.nama = nama;
            localStorage.setItem('resik_user', JSON.stringify(userData));
            document.getElementById('sidebar-nama').textContent = nama;

            const alertEl = document.getElementById('alert-success');
            alertEl.style.display = 'block';
            setTimeout(() => alertEl.style.display = 'none', 3000);
        }

        btn.disabled = false;
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Simpan Perubahan`;
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
        loadProfil();
    });

    loadProfil();
</script>
</body>
</html>
